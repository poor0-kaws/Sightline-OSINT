[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sightline-osint"
version = "0.1.0"
description = "A small OSINT ingestion prototype that is growing into a graph-based investigation tool."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
    "uvicorn>=0.30",
]
graph = [
    "neo4j>=5.20",
]

[tool.setuptools.packages.find]
include = ["backend*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
